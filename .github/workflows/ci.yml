name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - run: bundle exec rake
      - run: bundle exec rake build

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILS_ACCEPTANCE_DB_HOST: 127.0.0.1
      RAILS_ACCEPTANCE_DB_USER: postgres
      RAILS_ACCEPTANCE_DB_PASSWORD: postgres
      REQUIRE_MINITEST_TESTMON: "1"
      REQUIRE_RAILS_ACCEPTANCE: "1"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - run: bundle exec rake test:acceptance
