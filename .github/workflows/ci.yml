name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - run: bundle exec rake
      - run: bundle exec rake package_native_smoke

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILS_ACCEPTANCE_DB_HOST: 127.0.0.1
      RAILS_ACCEPTANCE_DB_USER: postgres
      RAILS_ACCEPTANCE_DB_PASSWORD: postgres
      REQUIRE_MINITEST_TESTMON: "1"
      REQUIRE_RAILS_ACCEPTANCE: "1"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - run: bundle exec bundlebun install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: bundle exec bundlebun node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bundle exec rake test:acceptance
